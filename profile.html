<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0f24">
<title>Planner — Profile</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script>
  try { if (localStorage.getItem('planner_theme') === 'light') document.documentElement.setAttribute('data-theme', 'light'); } catch (e) {}
</script>
<link rel="stylesheet" href="styles.css">
<style>
  #profilePage{ display:flex; flex-direction:column; height:100%; overflow-y:auto; }
  .profile-body{ padding:8px 16px calc(32px + env(safe-area-inset-bottom)) 16px; }

  .profile-head{ display:flex; align-items:center; gap:16px; background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:20px; margin-top:6px; }
  .profile-avatar{ width:64px; height:64px; border-radius:50%; background-color:var(--panel-2); background-position:center; background-size:cover; background-repeat:no-repeat; display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:700; color:var(--accent); flex-shrink:0; border:2px solid var(--line); }
  .profile-name{ font-size:16px; font-weight:600; }
  .profile-email{ font-size:12px; color:var(--sub); margin-top:3px; }

  .profile-stats{ display:flex; gap:10px; margin-top:16px; }
  .pstat{ flex:1; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px 8px; text-align:center; }
  .pstat-val{ font-size:20px; font-weight:700; }
  .pstat-lbl{ font-size:9.5px; color:var(--sub); text-transform:uppercase; letter-spacing:0.4px; margin-top:4px; }

  .profile-signout{ margin-top:24px; }
</style>
</head>
<body>
<div id="shell">

<div id="gateMount"></div>

<div id="profilePage" style="display:none;" class="page-fade-in">
  <div class="page-header">
    <a class="icon-btn" href="index.html" aria-label="Back">&larr;</a>
    <h1>Profile</h1>
    <button class="sync-chip" id="syncChip" aria-label="Sync now">
      <span class="sync-pip" id="syncDot"></span><span id="syncText">Synced</span><span class="sync-icon">&#8635;</span>
    </button>
    <button class="icon-btn" id="menuBtn" aria-label="Menu">&#9776;</button>
  </div>

  <div class="profile-body">
    <div class="profile-head">
      <div class="profile-avatar" id="profileAvatar">?</div>
      <div>
        <div class="profile-name" id="profileName">Signed in with Google</div>
        <div class="profile-email" id="profileEmail"></div>
      </div>
    </div>
    <div class="profile-stats">
      <div class="pstat"><div class="pstat-val" id="statTasks">0</div><div class="pstat-lbl">Tasks logged</div></div>
      <div class="pstat"><div class="pstat-val" id="statDays">0</div><div class="pstat-lbl">Days tracked</div></div>
      <div class="pstat"><div class="pstat-val" id="statTopCat">&mdash;</div><div class="pstat-lbl">Top category</div></div>
    </div>
    <div class="sheet-actions profile-signout">
      <button class="btn btn-delete" id="profileSignOutBtn">Sign out</button>
    </div>
  </div>
</div>

<div id="drawerMount"></div>

</div><!-- /#shell -->

<script src="config.js"></script>
<script src="auth.js"></script>
<script src="sheetsApi.js"></script>
<script src="core.js"></script>
<script src="profile.js"></script>
</body>
</html>
